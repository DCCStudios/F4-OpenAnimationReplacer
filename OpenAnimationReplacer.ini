[General]
bEnabled=1
bEnableUI=1
bAsyncParsing=1
bDisablePreloading=0
bFilterOutDuplicateAnimations=1
bShowWelcomeBanner=1
; Direct path matching (default 1): match replacements against the clip's
; resolved on-disk animation path (e.g. Weapons\SCAR\WPNReload.hkx); leaf-name
; matching is only used as a fallback for clips whose real path cannot be
; resolved. Set to 0 to restore the legacy leaf-matching behavior everywhere.
bDirectPathMatching=1
; Optional skeleton compatibility gate. When 1, reject candidates whose
; authored skeleton root or perspective differs from the playing clip. This
; can prevent cross-skeleton corruption, but may reject valid special idles
; hosted by the opposite perspective graph. Default 0.
bSkeletonCompatibilityGate=0
; Auto-reload mode. The engine's own automatic reloads are ALWAYS suppressed:
; they are attack-initiated, so the engine cuts the reload animation short as
; soon as the magazine refills (reloadComplete annotation). OAR's replacement
; reloads go through the reload-key path and play the full animation.
; Compatible with ManualReloadF4SE.
;   0 = Auto-Reload On Last Round (default): reload when the mag hits 0 by firing
;   1 = Auto-Reload On Fire Press When Empty: reload when firing on an empty mag
;   2 = Suppress Auto-Reload: no automatic reloads; reload key only
iAutoReloadMode=0
; Play a dry-fire click when firing on an empty magazine (the engine's
; suppressed auto-reload path is otherwise silent). Uses the weapon's Attack
; Fail sound, or the vanilla 10mm dry-fire click if the weapon has none.
bPlayDryFireSound=1

[UI]
; DIK scan code for the overlay toggle. Default 60 (0x3C) = F2.
; Change in-game via Settings → Activation Key, or set here.
iToggleKey=60
; When 1, Shift must also be held with iToggleKey. Default 0 (F2 alone).
bRequireShift=0
; Text size for every OAR window, expressed as a percentage. This multiplies
; Windows display DPI scaling, and window dimensions follow the combined scale
; to preserve the usable content area. Range 50-200; default 125.
iTextSizePercent=125
; UI language resource. en_US keeps the default English UI; set zh_CN when installed.
sLanguage=en_US
; Optional absolute path to a CJK font. Empty uses common Windows Chinese fonts.
sCJKFontPath=

[AnimationLog]
bLogActivate=1
bLogReplace=1
bLogLoop=1
bLogEcho=0
bLogToFile=0
iMaxLogEntries=100

[Limits]
iAnimationLimit=16384
iHavokHeapMultiplier=2

[Debug]
bVerboseLogging=0
